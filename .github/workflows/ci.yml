name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
